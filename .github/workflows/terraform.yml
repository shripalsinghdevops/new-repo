name: Terraform CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.13.3"
  TF_WORKING_DIR: "parent_module/prod"

jobs:

  # ============================================================
  # CI - Terraform Validation & Plan
  # ============================================================

  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parent_module/prod

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Check Working Directory
      - name: Check Terraform Directory
        run: |
          echo "Current Directory:"
          pwd

          echo "Terraform Files:"
          ls -la

          echo "Child Modules:"
          ls -la ../../child_modules

      # 5. Terraform Format
      - name: Terraform Format Check
        run: terraform fmt -check

      # 6. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 7. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 8. Terraform Plan
      - name: Terraform Plan
        run: terraform plan


  # ============================================================
  # CD - Terraform Apply / Destroy
  # Runs only when manually triggered
  # ============================================================

  terraform-cd:
    name: Terraform CD
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.action == 'apply' ||
         github.event.inputs.action == 'destroy')

    environment:
      name: production

    defaults:
      run:
        working-directory: parent_module/prod

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform init

      # 5. Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 6. Terraform Plan
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # 7. Terraform Apply
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      # 8. Terraform Destroy
      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve